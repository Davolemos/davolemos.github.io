<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ARG Workflow</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #323232; color: #e6e6e6;
    font: 12px/1.3 -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-user-select: none; user-select: none; cursor: default;
  }
  #buscar {
    flex: 0 0 auto; margin: 8px 8px 0; padding: 5px 8px; box-sizing: border-box; width: calc(100% - 16px);
    font: inherit; color: inherit; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12); border-radius: 4px; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  #buscar:focus { border-color: #2680eb; }
  #lista { flex: 1 1 auto; overflow-y: auto; padding: 6px 8px 4px; }
  h2 {
    font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    opacity: .55; margin: 10px 2px 5px;
  }
  h2:first-child { margin-top: 2px; }
  button.item {
    display: block; width: 100%; box-sizing: border-box; margin: 0 0 4px;
    padding: 7px 10px; text-align: left; font: inherit; color: inherit;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.10);
    border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  button.item:hover { background: rgba(255,255,255,.16); }
  button.item:active, button.item.activo { background: #2680eb; border-color: #2680eb; color: #fff; }
  button:focus { outline: none; }
  button.item.cadena::before { content: "▸▸ "; opacity: .7; }
  button.item.usuario::after { content: " •"; opacity: .45; }
  #vacio { opacity: .6; padding: 12px 4px; line-height: 1.5; }
  #pie {
    flex: 0 0 auto; display: flex; align-items: center; gap: 4px;
    padding: 4px 6px 4px 10px; border-top: 1px solid rgba(128,128,128,.3);
  }
  #estado {
    flex: 1 1 auto; min-width: 0; font-size: 11px; opacity: .7;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #estado.error { color: #ff7b72; opacity: 1; white-space: normal; -webkit-user-select: text; user-select: text; }
  #pie button.icono {
    flex: 0 0 auto; width: 26px; height: 24px; padding: 0; font-size: 14px; line-height: 24px;
    color: inherit; background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer;
  }
  #pie button.icono:hover { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.1); }
  body.claro { color: #2c2c2c; }
  body.claro #buscar { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.14); }
  body.claro button.item { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.14); }
  body.claro button.item:hover { background: rgba(0,0,0,.11); }
  body.claro button.item:active, body.claro button.item.activo { background: #2680eb; color: #fff; }
  body.claro #pie button.icono:hover { background: rgba(0,0,0,.08); }
  body.claro #estado.error { color: #c0392b; }
</style>
</head>
<body>
<input id="buscar" type="search" placeholder="Buscar…" spellcheck="false">
<div id="lista"></div>
<div id="pie">
  <div id="estado">Cargando…</div>
  <button class="icono" id="btnCarpeta" title="Abrir la carpeta de scripts personales">📂</button>
  <button class="icono" id="btnRecargar" title="Recargar la lista de scripts">↻</button>
</div>
<script src="botones.js"></script>
<script src="panel.js"></script>
</body>
</html>
