<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Web a PDF</title>
<style>
  :root { --bg:#fafaf8; --fg:#1a1a1a; --muted:#6b6b6b; --line:#e3e3df; --accent:#1a1a1a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#f0f0ec; --muted:#9a9a96; --line:#2c2c2a; --accent:#f0f0ec; } }
  * { box-sizing:border-box; }
  body { margin:0; width:300px; padding:16px; background:var(--bg); color:var(--fg); font:13px/1.45 system-ui, sans-serif; }
  h1 { font-size:14px; margin:0 0 12px; letter-spacing:.02em; }
  button { width:100%; font:inherit; padding:9px 10px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; margin-top:8px; text-align:left; }
  button.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  small { display:block; color:inherit; opacity:.7; font-size:11.5px; }
  .status { min-height:1.4em; margin-top:12px; color:var(--muted); }
</style>
</head>
<body>
  <h1>Web a PDF</h1>
  <button id="long" class="primary">Una página larga<small>Igual que en pantalla, de arriba abajo</small></button>
  <button id="a4">Hojas A4<small>Para imprimir o leer por páginas</small></button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
