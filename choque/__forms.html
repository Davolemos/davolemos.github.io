<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>Formularios</title>
</head>
<body>
<!-- Copia estática del formulario "brief" para que Netlify Forms lo detecte al publicar.
     El formulario visible lo crea assets/main.js; los nombres de los campos deben coincidir. -->
<form name="brief" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="brief">
  <input type="hidden" name="subject">
  <input name="bot-field">
  <input name="nombre">
  <input name="marca">
  <input type="email" name="email">
  <input type="tel" name="whatsapp">
  <input name="servicio">
  <input name="presupuesto">
  <input name="tiempo">
  <textarea name="mensaje"></textarea>
  <input type="hidden" name="pagina">
  <input type="hidden" name="fuente">
  <input type="hidden" name="idioma">
</form>

<!-- Brief completo (página /brief/): el resumen llega armado en el campo "resumen". -->
<form name="brief-proyecto" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
  <input type="hidden" name="form-name" value="brief-proyecto">
  <input type="hidden" name="subject">
  <input name="bot-field">
  <input name="nombre">
  <input type="email" name="email">
  <input type="tel" name="whatsapp">
  <input name="tipo">
  <textarea name="resumen"></textarea>
  <input name="sin_definir">
  <input type="hidden" name="idioma">
  <input type="hidden" name="fuente">
  <input type="file" name="imagen1">
  <input type="file" name="imagen2">
  <input type="file" name="imagen3">
</form>
</body>
</html>
