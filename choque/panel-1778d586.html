<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Panel — choque</title>
<link rel="icon" href="img/marca/simbolo-negro.png" type="image/png">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body { min-height: 100dvh; display: grid; place-items: center; padding: 24px var(--gutter); }
  .panel { width: min(100%, 440px); display: grid; gap: 28px; }
  .panel header { display: flex; align-items: center; justify-content: space-between; }
  .panel header img { height: 30px; width: auto; }
  .panel h1 { font-size: 34px; line-height: 1.05; letter-spacing: -0.04em; }
  .panel p.sub { color: var(--ink-2); margin-top: 8px; font-size: 15px; }
  .card { display: grid; gap: 22px; padding: 24px; border-radius: 24px; background: var(--surface); }
  fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 10px; }
  legend, label.lbl { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice input { position: absolute; opacity: 0; pointer-events: none; }
  .choice label {
    display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 16px;
    background: var(--bg); font-weight: 500; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line);
    transition: box-shadow 150ms ease, transform 160ms var(--ease-out);
  }
  .choice label:active { transform: scale(0.97); }
  .choice input:checked + label { box-shadow: inset 0 0 0 2px var(--ink); }
  .choice input:focus-visible + label { outline: 2px solid var(--ink); outline-offset: 2px; }
  .choice .d { width: 10px; height: 10px; border-radius: 50%; }
  select, input[type="password"] {
    width: 100%; min-height: 52px; padding: 0 16px; border: 0; border-radius: 14px;
    background: var(--bg); color: var(--ink); font: 500 16px var(--sans); box-shadow: inset 0 0 0 1px var(--line);
  }
  .remember { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); margin-top: 8px; }
  .preview { display: grid; gap: 10px; }
  .preview .status { justify-self: start; }
  [hidden] { display: none !important; }
  .btn { width: 100%; }
  .msg { min-height: 1.4em; font-size: 15px; text-align: center; }
  .msg.ok { color: #1F7A45; } .msg.err { color: #B4291C; }
</style>
</head>
<body>
<main class="panel">
  <header>
    <img src="img/marca/logo-negro.png" alt="choque" width="1160" height="310">
    <a href="index.html" style="font-size:14px;color:var(--ink-2)">Ver sitio →</a>
  </header>

  <div>
    <h1>Estado de la agenda</h1>
    <p class="sub">Cambia lo que ven los clientes arriba del titular en la página principal.</p>
  </div>

  <form class="card" id="form" novalidate>
    <fieldset>
      <legend>Estado</legend>
      <div class="choice">
        <input type="radio" name="estado" id="abierta" value="abierta" checked>
        <label for="abierta"><span class="d" style="background:#1F9D55"></span>Abierta</label>
        <input type="radio" name="estado" id="cerrada" value="cerrada">
        <label for="cerrada"><span class="d" style="background:#D93A2B"></span>Cerrada</label>
      </div>
    </fieldset>

    <div>
      <label class="lbl" for="mes" style="display:block">Mes que se muestra</label>
      <select id="mes">
        <option value="enero">Enero</option><option value="febrero">Febrero</option><option value="marzo">Marzo</option>
        <option value="abril">Abril</option><option value="mayo">Mayo</option><option value="junio">Junio</option>
        <option value="julio">Julio</option><option value="agosto">Agosto</option><option value="septiembre">Septiembre</option>
        <option value="octubre">Octubre</option><option value="noviembre">Noviembre</option><option value="diciembre">Diciembre</option>
      </select>
    </div>

    <div id="regreso-box" hidden>
      <label class="lbl" for="regreso" style="display:block">Regresamos en</label>
      <select id="regreso">
        <option value="">No mostrar</option>
        <option value="enero">Enero</option><option value="febrero">Febrero</option><option value="marzo">Marzo</option>
        <option value="abril">Abril</option><option value="mayo">Mayo</option><option value="junio">Junio</option>
        <option value="julio">Julio</option><option value="agosto">Agosto</option><option value="septiembre">Septiembre</option>
        <option value="octubre">Octubre</option><option value="noviembre">Noviembre</option><option value="diciembre">Diciembre</option>
      </select>
    </div>

    <div class="preview">
      <span class="lbl" style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase">Así se verá</span>
      <span class="status" id="preview" data-status="abierta"><span class="dot" aria-hidden="true"></span><span id="preview-text">Agenda abierta · Octubre</span></span>
    </div>

    <div>
      <label class="lbl" for="password" style="display:block">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <label class="remember"><input type="checkbox" id="remember"> Recordar en este dispositivo</label>
    </div>

    <button class="btn btn-dark" type="submit" id="save">Guardar cambios</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
  const form = document.getElementById('form');
  const mes = document.getElementById('mes');
  const regreso = document.getElementById('regreso');
  const regresoBox = document.getElementById('regreso-box');
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const cap = (m) => m[0].toUpperCase() + m.slice(1);
  const pass = document.getElementById('password');
  const remember = document.getElementById('remember');
  const msg = document.getElementById('msg');
  const save = document.getElementById('save');
  const preview = document.getElementById('preview');
  const previewText = document.getElementById('preview-text');
  const KEY = 'choque-admin-pass';

  const estado = () => form.elements.estado.value;
  const render = () => {
    const cerrada = estado() === 'cerrada';
    regresoBox.hidden = !cerrada;
    const back = cerrada && regreso.value ? ` · Regresamos en ${regreso.value}` : '';
    previewText.textContent = `${cerrada ? 'Agenda cerrada' : 'Agenda abierta'} · ${cap(mes.value)}${back}`;
    preview.dataset.status = estado();
  };
  const say = (text, kind) => { msg.textContent = text; msg.className = 'msg ' + (kind || ''); };

  try { const p = localStorage.getItem(KEY); if (p) { pass.value = p; remember.checked = true; } } catch {}
  mes.value = MESES[new Date().getMonth()];
  regreso.value = MESES[(new Date().getMonth() + 1) % 12];
  render();

  // Load the current status
  fetch('/api/estado', { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : Promise.reject()))
    .then((s) => {
      form.elements.estado.value = s.abierta ? 'abierta' : 'cerrada'; mes.value = s.mes;
      regreso.value = s.regreso || (s.abierta ? MESES[(MESES.indexOf(s.mes) + 1) % 12] : '');
      render();
    })
    .catch(() => say('No se pudo leer el estado actual. Este panel funciona solo en el sitio publicado en Netlify.', 'err'));

  form.addEventListener('change', render);
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!pass.value) { say('Escribe la contraseña.', 'err'); pass.focus(); return; }
    save.disabled = true; say('Guardando…');
    try {
      const r = await fetch('/api/estado', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: pass.value, abierta: estado() === 'abierta', mes: mes.value, regreso: estado() === 'cerrada' ? regreso.value : '' }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'No se pudo guardar. Intenta de nuevo.');
      try { remember.checked ? localStorage.setItem(KEY, pass.value) : localStorage.removeItem(KEY); } catch {}
      say('Guardado. El sitio ya muestra el nuevo estado.', 'ok');
    } catch (err) {
      say(err.message === 'Failed to fetch' ? 'Sin conexión con el servidor. Intenta de nuevo.' : err.message, 'err');
    } finally { save.disabled = false; }
  });
</script>
</body>
</html>
