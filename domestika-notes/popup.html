<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Domestika Notes</title>
<style>
  :root { --bg:#fafaf8; --fg:#1a1a1a; --muted:#6b6b6b; --line:#e3e3df; --accent:#1a1a1a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --fg:#f0f0ec; --muted:#9a9a96; --line:#2c2c2a; --accent:#f0f0ec; } }
  * { box-sizing:border-box; }
  body { margin:0; width:340px; padding:16px; background:var(--bg); color:var(--fg); font:13px/1.45 system-ui, sans-serif; }
  h1 { font-size:14px; margin:0 0 12px; letter-spacing:.02em; }
  select, button { width:100%; font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--fg); }
  button { cursor:pointer; margin-top:8px; }
  button.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  button.danger { color:#c0392b; }
  ul { list-style:none; margin:12px 0; padding:0; max-height:220px; overflow:auto; border-top:1px solid var(--line); }
  li { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
  li span:last-child { color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .empty, .status { color:var(--muted); }
  .status { min-height:1.4em; margin-top:8px; }
  label.toggle { display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--muted); }
  label.toggle input { width:auto; margin:0; }
  .hint { color:var(--muted); font-size:12px; margin-top:4px; }
</style>
</head>
<body>
  <h1>Domestika Notes</h1>
  <select id="course"></select>
  <label class="toggle"><input type="checkbox" id="autoFrames"> Capturar escenas automáticamente</label>
  <div class="hint">Atajo para capturar a mano: Alt+Shift+S</div>
  <ul id="lessons"></ul>
  <button id="zip" class="primary">Descargar ZIP (Markdown + imágenes)</button>
  <button id="copy">Copiar solo el texto</button>
  <button id="clear" class="danger">Borrar este curso</button>
  <button id="diagnose">Diagnóstico (si no recoge nada)</button>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
